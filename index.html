<script>
(()=>{
const $=id=>document.getElementById(id);
const KEY='uchet_v2';
const CARS=[['Москвич 3',50,'АИ-92',0.098],['SENAT 900',62,'АИ-95',null],['Haval Jolion',55,'АИ-92',0.092],['Hyundai Sonata',60,'АИ-92',0.087],['Луидор-225033',80,'АИ-92',0.16],['Аврора - 311302',80,'ДТ',0.127],['ПАЗ - 32053 - 50',105,'АИ-92',0.32],['ПАЗ - 320530 - 02',105,'АИ-92',0.339],['КАВЗ 4238 - 62',170,'ДТ',0.36],['КАВЗ 4238 - D1',170,'ДТ',0.373],['ПАЗ - 4234 - 04',95,'ДТ',0.224],['Volkswagen M',80,'ДТ',0.084],['ГАЗ A65 R32',80,'ДТ',0.154],['ACM - 535251',80,'ДТ',0.15],['Sollers Atlant',80,'ДТ',0.121],['Ford Transit',80,'ДТ',0.145]];
let V=[],aid=null,edit=false,last='m',al='21',theme=null,tt,R=null;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const num=v=>{const r=String(v??'').trim().replace(',','.');if(r===''||r==='-')return 0;const n=Number(r);return Number.isFinite(n)?Math.max(0,n):0};
const fmt=(x,d=1)=>(Number(x)||0).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const rnd=(x,d=1)=>Math.round((Number(x)||0)*10**d)/10**d;
const nf=x=>String(x).replace('.',',');
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=s=>s?s.slice(8)+'.'+s.slice(5,7)+'.'+s.slice(2,4):'—';
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const toast=m=>{const t=$('ts');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)};
function tw(el,to,d=1,s=''){const f=el._c??0;cancelAnimationFrame(el._r);if(reduce||f===to){el._c=to;el.textContent=fmt(to,d)+s;return}const t0=performance.now();const st=t=>{const p=Math.min(1,(t-t0)/550);el._c=p<1?f+(to-f)*(1-Math.pow(1-p,3)):to;el.textContent=fmt(el._c,d)+s;if(p<1)el._r=requestAnimationFrame(st)};el._r=requestAnimationFrame(st)}
const sure=(b,fn)=>{if(b.dataset.s){clearTimeout(b._t);delete b.dataset.s;b.textContent=b._o;return fn()}b._o=b.textContent;b.dataset.s=1;b.textContent='Нажмите ещё раз';b._t=setTimeout(()=>{delete b.dataset.s;b.textContent=b._o},2500)};
const copy=async(t,m)=>{try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}toast(m)};
const carData=v=>{const c=CARS[v.carIdx]||CARS[0];return{name:c[0],tank:c[1],fuelType:c[2],norm:v.manualNorm!=null&&v.manualNorm!==''?num(v.manualNorm):c[3]}};
const active=()=>V.find(v=>v.id===aid)||V[0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({vehicles:V,activeId:aid,theme}))}catch(e){}};
const load=()=>{try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.vehicles)&&s.vehicles.length){V=s.vehicles;aid=s.activeId||V[0].id;theme=s.theme||(s.dark?'dark':null);return true}}catch(e){}return false};
const isDark=()=>theme?theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
const applyTheme=()=>{if(theme)document.documentElement.dataset.theme=theme;$('th').textContent=isDark()?'☀':'☾'};
 
function rChips(){const l=$('vl');l.innerHTML=V.map(v=>`<button type="button" class="chip${v.id===aid?' on':''}" data-id="${v.id}">${carData(v).name} · ${esc(v.code)}</button>`).join('')+'<button type="button" class="chip" id="add">＋ Машина</button>';const a=l.querySelector('.on');if(a)l.scrollTo({left:a.offsetLeft-30,behavior:'smooth'})}
function rHist(){const v=active(),p=(v&&v.periods)||[];$('hc').textContent=p.length||'';$('hl').innerHTML=p.length?[...p].reverse().map(x=>`<div class="hr"><div><b>${fd(x.dateFrom)} → ${fd(x.dateTo)}</b>${x.comment?`<small>${esc(x.comment)}</small>`:''}</div><div><b>${fmt(x.cons,1)} л</b><small>${fmt(x.km,0)} км, заправка ${fmt(x.added,0)} л</small></div></div>`).join(''):'<div class="em">Пока нет периодов</div>'}
 
function calc(){
 const v=active();
 if(!v){R=null;$('sumOdo').textContent=$('sumFuel').textContent='—';$('meta').textContent='Добавьте первую машину';return null}
 const c=carData(v),nm=c.norm||.1;
 let T=num(kT.value),M=num(kM.value),O=num(kO.value);
 if(T>0){if(last==='m'){O=rnd(Math.max(0,T-M),1);if(document.activeElement!==kO)kO.value=O?nf(O):''}else{M=rnd(Math.max(0,T-O),1);if(document.activeElement!==kM)kM.value=M?nf(M):''}}
 const sum=rnd(M+O,1),km=T>0?T:sum,a=al==='c'?num(cu.value):+al,n2=nm*(1+a/100),c1=M*nm,c2=O*n2,cons=rnd(c1+c2,2),add=num(tk.value),end=rnd(v.fuel+add-cons,1),no=num(oE.value)>0?num(oE.value):rnd(v.odo+km,0);
 const bad=T>0&&Math.abs(sum-T)>.3,p=sum>0?Math.round(M/sum*100):0;
 $('ck').className='ck '+(bad?'bad':sum>0?'ok':'');
 $('ck').innerHTML=sum?`<span>${bad?'Сумма не равна пробегу':`МКАД ${p}%, вне ${100-p}%`}</span><b>${fmt(sum)}${bad?' ≠ '+fmt(T):''} км</b>`:'<span>Укажите пробег</span><b>0 км</b>';
 $('s1').style.width=(sum?M/sum*100:0)+'%';$('s2').style.width=(sum?O/sum*100:0)+'%';
 oE.placeholder=km>0?String(no):'—';
 tw($('sumOdo'),v.odo,0);tw($('sumFuel'),v.fuel,1);
 $('oN').textContent=km>0?'→ '+fmt(no,0)+' км':'';$('oN').classList.toggle('s',km>0);
 const ch=add>0||cons>0,wr=end<0||end>c.tank;
 $('fN').textContent=ch?'→ '+fmt(end,1)+' л':'';$('fN').className=(ch?'s':'')+(wr?' w':'');
 const pc=x=>Math.max(0,Math.min(100,x/c.tank*100))+'%';
 $('gN').style.width=pc(v.fuel);$('gA').style.width=pc(end);$('gg').className='gauge'+(end<0||end>c.tank?' neg':end<c.tank*.15?' low':'');
 $('meta').textContent=`${c.fuelType}, ${c.norm?fmt(c.norm*100,1)+' л/100 км':'норма вручную'}, бак ${c.tank} л`+(v.fio?', '+v.fio:'');
 tw($('cons'),cons,1);tw($('kmO'),km,0,' км');tw($('c1'),c1,1,' л');tw($('c2'),c2,1,' л');tw($('eO'),end,1,' л');
 $('f1').textContent=`МКАД ${fmt(M,0)} км × ${fmt(nm*100,1)}`;
 $('f2').textContent=`Вне ${fmt(O,0)} км × ${fmt(n2*100,1)}`+(a?` (+${a}%)`:'');
 $('f3').textContent=`Бак ${fmt(v.fuel,1)} + ${fmt(add,1)} − ${fmt(cons,1)}`;
 $('wn').textContent=end<0?`Не хватает ${fmt(-end,1)} л`:end>c.tank?`Больше бака на ${fmt(end-c.tank,1)} л`:'';
 return R={v,c,nm,a,M,O,km,cons,add,end,no};
}
const kT=$('kT'),kM=$('kM'),kO=$('kO'),oE=$('oE'),tk=$('tk'),cu=$('cu'),d1=$('d1'),d2=$('d2'),cm=$('cm');
const clr=()=>{[kT,oE,kM,kO,tk,cm].forEach(e=>e.value='');last='m'};
const all=()=>{rChips();rHist();calc()};
const rep=(c,v,o)=>`Машина: ${c.name} (${v.code})\nВодитель: ${v.fio||'—'}\nПериод: ${fd(o.dateFrom)} → ${fd(o.dateTo)}\nПробег: ${fmt(o.km,0)} км (МКАД ${fmt(o.kmMkad||0,0)})\nРасход: ${fmt(o.cons,1)} л\nЗаправлено: ${fmt(o.added,1)} л\nБак: ${fmt(o.fuelEnd,1)} л`+(o.comment?`\nКомментарий: ${o.comment}`:'');
 
function savePeriod(){
 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 const r=calc();if(!r)return toast('Сначала добавьте машину');
 if(!d1.value||!d2.value)return toast('Укажите даты периода');
 if(r.km<=0)return toast('Введите пробег');
 const v=r.v;v.periods=v.periods||[];
 v.periods.push({id:uid(),dateFrom:d1.value,dateTo:d2.value,km:r.km,kmMkad:r.M,kmOther:r.O,cons:r.cons,added:r.add,fuelStart:v.fuel,fuelEnd:r.end,odo:r.no,allow:r.a,comment:cm.value.trim(),createdAt:new Date().toISOString()});
 v.odo=r.no;v.fuel=Math.max(0,r.end);clr();d1.value=d2.value=today();all();save();
 const b=$('sv');b.classList.add('done');b.textContent='✓ Сохранено';setTimeout(()=>{b.classList.remove('done');b.textContent='Сохранить период'},1500);
}
function openV(e){edit=!!e;$('mt').textContent=e?'Изменить машину':'Новая машина';const v=e&&active();
 $('mCar').value=v?v.carIdx:0;$('mCode').value=v?v.code||'':'';$('mFio').value=v?v.fio||'':'';$('mOdo').value=v&&v.odo?v.odo:'';$('mFuel').value=v?nf(v.fuel):'';$('mNorm').value=v&&v.manualNorm?v.manualNorm:'';
 onCar();$('vo').classList.add('show')}
function onCar(){const c=CARS[+$('mCar').value];$('mnb').classList.toggle('hidden',c[3]!==null);if(c[3]!=null)$('mNorm').value=nf(c[3])}
function saveV(){
 const code=$('mCode').value.trim().toUpperCase().replace(/\s+/g,'');if(!code){toast('Введите позывной или код');$('mCode').focus();return}
 const carIdx=+$('mCar').value,c=CARS[carIdx],fuel=num($('mFuel').value),odo=num($('mOdo').value);
 if(fuel>c[1]+.5){toast(`Бак максимум ${c[1]} л`);return}
 const d={carIdx,code,fio:$('mFio').value.trim(),odo,fuel,manualNorm:$('mNorm').value};
 if(edit&&active())Object.assign(active(),d);else{const v={id:uid(),periods:[],...d};V.push(v);aid=v.id;clr()}
 $('vo').classList.remove('show');all();save();toast('Сохранено');
}
function bind(){
 $('th').onclick=()=>{theme=isDark()?'light':'dark';applyTheme();save()};
 $('vl').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;if(b.id==='add')return openV(false);aid=b.dataset.id;clr();all();save()});
 kT.addEventListener('input',()=>{oE.value='';calc()});
 kM.addEventListener('input',()=>{last='m';calc()});
 kO.addEventListener('input',()=>{last='o';calc()});
 oE.addEventListener('input',()=>{const v=active(),e=num(oE.value);if(v&&e>v.odo)kT.value=nf(rnd(e-v.odo,1));calc()});
 [tk,cu].forEach(e=>e.addEventListener('input',calc));
 $('qf').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=+b.dataset.v;tk.value=a?nf(num(tk.value)+a):'';calc()};
 $('al').onclick=e=>{const b=e.target.closest('button');if(!b)return;al=b.dataset.v;[...$('al').children].forEach(x=>x.classList.toggle('on',x===b));$('cb').classList.toggle('hidden',al!=='c');if(al==='c')cu.focus();calc()};
 $('sv').onclick=savePeriod;
 $('cp').onclick=()=>{const r=calc();if(!r||r.km<=0)return toast('Нечего копировать');copy(rep(r.c,r.v,{dateFrom:d1.value,dateTo:d2.value,km:r.km,kmMkad:r.M,cons:r.cons,added:r.add,fuelEnd:r.end,comment:cm.value.trim()}),'Скопировано')};
 $('shr').onclick=async()=>{const v=active(),p=v&&v.periods&&v.periods[v.periods.length-1];if(!p)return toast('Нет сохранённых периодов');const t=rep(carData(v),v,p);if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name==='AbortError')return}}copy(t,'Отчёт скопирован')};
 $('clr').onclick=function(){sure(this,()=>{const v=active();if(v)v.periods=[];rHist();save()})};
 $('mCar').onchange=onCar;$('mSave').onclick=saveV;$('mCancel').onclick=()=>$('vo').classList.remove('show');
 $('mn').onclick=()=>$('mo').classList.add('show');$('mClose').onclick=()=>$('mo').classList.remove('show');
 $('mEdit').onclick=()=>{$('mo').classList.remove('show');if(active())openV(true)};
 $('mDel').onclick=function(){sure(this,()=>{const v=active();if(!v)return;V=V.filter(x=>x!==v);aid=V[0]?V[0].id:null;$('mo').classList.remove('show');clr();all();save();if(!V.length)openV(false)})};
 $('mReset').onclick=function(){sure(this,()=>{try{localStorage.removeItem(KEY)}catch(e){}V=[];aid=null;$('mo').classList.remove('show');clr();all();openV(false);toast('Всё сброшено')})};
 ['vo','mo'].forEach(i=>$(i).addEventListener('click',e=>{if(e.target===$(i))$(i).classList.remove('show')}));
}
$('mCar').innerHTML=CARS.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('');
d1.value=d2.value=today();
const has=load();applyTheme();bind();all();if(!has)openV(false);
})();
</script>
</body>
</html>
